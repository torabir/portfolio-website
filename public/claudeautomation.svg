<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="510" fill="url(#bg)"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="900" height="44" fill="#020617" opacity="0.85"/>
  <circle cx="26" cy="22" r="7" fill="#f87171"/>
  <circle cx="50" cy="22" r="7" fill="#fbbf24"/>
  <circle cx="74" cy="22" r="7" fill="#34d399"/>
  <text x="450" y="27" text-anchor="middle" fill="#94a3b8" font-size="15">claude-automation · agentic pipelines</text>

  <!-- schedule -->
  <rect x="50" y="90" width="180" height="70" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="140" y="120" text-anchor="middle" fill="#e2e8f0" font-size="17">⏰ Schedule</text>
  <text x="140" y="144" text-anchor="middle" fill="#94a3b8" font-size="13">cron · triggers</text>

  <!-- agent -->
  <rect x="330" y="78" width="240" height="94" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="450" y="116" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Claude Code</text>
  <text x="450" y="142" text-anchor="middle" fill="#c7d2fe" font-size="13">agents · skills · tools</text>

  <!-- outputs -->
  <rect x="670" y="66" width="180" height="54" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="760" y="98" text-anchor="middle" fill="#e2e8f0" font-size="15">📋 Daily briefs</text>

  <rect x="670" y="134" width="180" height="54" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="760" y="166" text-anchor="middle" fill="#e2e8f0" font-size="15">🎬 Video pipeline</text>

  <!-- approval gate -->
  <rect x="330" y="228" width="240" height="64" rx="10" fill="#422006" stroke="#f59e0b"/>
  <text x="450" y="255" text-anchor="middle" fill="#fde68a" font-size="16">✋ Approval gates</text>
  <text x="450" y="278" text-anchor="middle" fill="#d6b47a" font-size="13">human review before publish</text>

  <!-- publish -->
  <rect x="670" y="228" width="180" height="64" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="760" y="255" text-anchor="middle" fill="#bbf7d0" font-size="16">🚀 Publish</text>
  <text x="760" y="278" text-anchor="middle" fill="#86efac" font-size="13">only when approved</text>

  <!-- arrows -->
  <line x1="230" y1="125" x2="322" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="103" x2="662" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="147" x2="662" y2="157" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="172" x2="450" y2="220" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="260" x2="662" y2="260" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- security layer -->
  <rect x="50" y="330" width="800" height="120" rx="12" fill="#0c1a33" stroke="#334155" stroke-dasharray="6 4"/>
  <text x="80" y="366" fill="#7dd3fc" font-size="16" font-weight="bold">🔒 Security layer</text>
  <text x="80" y="398" fill="#94a3b8" font-size="14">sandboxed execution · permission deny-rules · no secrets in context</text>
  <text x="80" y="424" fill="#94a3b8" font-size="14">curated public case study · no business data</text>

  <!-- prompt line -->
  <text x="50" y="486" fill="#34d399" font-size="15">$ claude ▊</text>
</svg>
